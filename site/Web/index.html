<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <div id="wrapper">
        <section id="sec1">
            <h1>Graphs</h1>
            <select id="histDays" onchange="changeDataRange(this.value)">
                <option value="1">1 day</option>
                <option value="2">2 days</option>
                <option value="3">3 days</option>
                <option value="5">5 days</option>
                <option value="7">7 days</option>
                <option value="14">14 days</option>
                <option value="30">30 days</option>
            </select>
            <div id="graphsWrapper">
                <section>
                    <h2>Temperature and Humidity</h2>
                    <div class="chartWrapper"><canvas id="tempHumChart"></canvas></div>
                </section>
            </div>
            <div id="stats">
                <h2>Statistics</h2>
                <p>Number of records loaded: <span id="numRecords"></span></p>
                <p>Current temperature: <span id="currentTemp"></span></p>
                <p>Current humidity: <span id="currentHum"></span></p>
            </div>
            <div id="sensorStatus">
                <h2>Sensor Status</h2>
                <table id="statusTable">
                    <tr>
                        <th>SensorID</th>
                        <th>Name</th>
                        <th>Status</th>
                        <th>Last Status</th>
                    </tr>
                </table>
            </div>
        </section>
    </div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
<script type="module" src="js/main.js"></script>
</html>
